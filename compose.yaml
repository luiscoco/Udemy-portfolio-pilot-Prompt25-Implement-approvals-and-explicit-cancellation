name: portfolio-pilot-local
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: portfolio_local
      POSTGRES_PASSWORD: local_only_change_me
      POSTGRES_DB: portfolio_pilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_local -d portfolio_pilot"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
volumes:
  postgres_data:
  redis_data:
